name: Build KPM Host Agent

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-lkm:
    name: Build kpm_host.ko (GKI 6.6)
    runs-on: ubuntu-latest
    container:
      # 使用完整版 ddk 镜像
      image: ghcr.io/ylarod/ddk:android15-6.6-20260828
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Inspect
        shell: bash
        run: |
          set -e
          echo "Environment KDIR: ${KDIR:-<empty>}"
          
          if [ -z "${KDIR:-}" ] || [ ! -f "$KDIR/Makefile" ]; then
            echo "ERROR: KDIR is unavailable."
            exit 1
          fi

          # 1. 修改 build.sh 里的源码路径
          sed -i 's|M="$HERE"|M="$HERE/../src"|g' build/build.sh
          
          # 2. 删掉原本写死的 B=...，完全依赖镜像的 PATH
          # 完整版镜像内部自带 clang，不要去指定绝对路径
          sed -i 's|^B=.*|# B=path_removed_by_ci|' build/build.sh
          sed -i 's|\$B/||g' build/build.sh
          
          # 3. 移除旧版 Clang 的 CFI 参数，关闭 format 警告
          sed -i 's|-fsanitize-cfi-canonical-jump-tables||g' build/build.sh
          sed -i 's|KCFLAGS="-ffixed-x18"|KCFLAGS="-ffixed-x18 -Wno-format"|g' build/build.sh
          
          # 4. 删掉 6.6 不支持的空函数调用
          sed -i '/resolve_cfi_shadow();/d' src/kpm_host_core.c
          
          # 执行编译 (用 || true 忽略 build.sh 结尾去 cp 旧文件时的报错)
          bash build/build.sh || true
          
          # 5. 提取产物
          if [ -f "src/kpm_host.ko" ]; then
            mv src/kpm_host.ko build/kpm_host-gki-6.6.ko
            echo "=== Successfully built build/kpm_host-gki-6.6.ko ==="
          else
            echo "ERROR: src/kpm_host.ko not found!"
            exit 1
          fi
          
          # 6. 你要的体检
          echo -e "\n=== [1] Vermagic (Check if 6.6.118) ==="
          modinfo -F vermagic build/kpm_host-gki-6.6.ko || true
          
          echo -e "\n=== [2] Sections (Check .versions) ==="
          readelf -S build/kpm_host-gki-6.6.ko | grep -E "\.versions|\.modinfo|\.gnu.linkonce.this_module" || true
          
          echo -e "\n=== [3] File Info ==="
          ls -lh build/kpm_host-gki-6.6.ko
          sha256sum build/kpm_host-gki-6.6.ko

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm_host-gki-6.6
          path: build/
          if-no-files-found: error
