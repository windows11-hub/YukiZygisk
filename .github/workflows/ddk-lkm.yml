name: Build KPM Host Agent

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-lkm:
    name: Build kpm_host.ko (GKI 6.6)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:android15-6.6-20260828
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Verify
        shell: bash
        run: |
          set -e
          # 完整版镜像默认设置了 KDIR
          echo "Using KDIR: $KDIR"
          if [ ! -f "$KDIR/Makefile" ]; then
            echo "ERROR: KDIR is unavailable."
            exit 1
          fi

          # 1. 修改源码，以适配 6.6 内核结构
          # 移除 6.6 不支持的 resolve_cfi_shadow 调用
          sed -i '/resolve_cfi_shadow();/d' src/kpm_host_core.c

          # 2. 直接调用 kbuild 编译，不再使用 build.sh
          cd src
          
          # 使用标准的 kbuild 流程编译模块
          # -Wno-format 用于屏蔽 6.6 内核中 Elf64_Xword 的格式警告
          make -C "$KDIR" \
            M="$PWD" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            KCFLAGS="-ffixed-x18 -Wno-format" \
            modules

          # 3. 将编译好的文件移到 build 目录
          cd ..
          mkdir -p build
          if [ -f "src/kpm_host.ko" ]; then
            mv src/kpm_host.ko build/kpm_host-gki-6.6.ko
            echo "=== SUCCESS: File generated ==="
          else
            echo "=== ERROR: File not generated ==="
            exit 1
          fi

          # 4. 输出关键信息（你要的体检）
          echo -e "\n=== CHECK: Vermagic (Must match device) ==="
          modinfo -F vermagic build/kpm_host-gki-6.6.ko || true
          
          echo -e "\n=== CHECK: Sections ==="
          readelf -S build/kpm_host-gki-6.6.ko | grep -E "\.versions|\.modinfo|\.gnu.linkonce.this_module" || true
          
          echo -e "\n=== CHECK: SHA256 ==="
          sha256sum build/kpm_host-gki-6.6.ko

      - name: Upload LKM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm_host-gki-6.6
          path: build/
          if-no-files-found: error
